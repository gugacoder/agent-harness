# ==============================================================================
# platform - dev ports
# ==============================================================================
# Exportação de portas do ecossistema somente para modo desenvolvimento
# Todas as portas usam prefixo 20* para consistência
# ==============================================================================

name: chegala-platform-${ENVIRONMENT}

services:

  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"

  kong:
    ports:
      - "${KONG_HTTP_PORT}:8000"
      - "${KONG_HTTPS_PORT}:8443"

  studio:
    ports:
      - "${STUDIO_PORT}:3000"

