# ==============================================================================
# platform
# ==============================================================================
# Stack: PostgreSQL, GoTrue, Kong, Storage, Studio (Supabase self-hosted)
# Servicos removidos: ver docker-compose.platform.opt-out
# ==============================================================================

name: chegala-platform-${ENVIRONMENT}

services:
  # ============================================================================
  # INIT - Cria estrutura de pastas com permissoes corretas
  # ============================================================================
  init:
    image: busybox:latest
    command: |
      sh -c "
        mkdir -p /data/postgres &&
        mkdir -p /data/storage &&
        mkdir -p /data/redis &&
        mkdir -p /data/evolution/instances &&
        mkdir -p /data/evolution/store &&
        chmod -R 777 /data/postgres &&
        chmod -R 777 /data/storage &&
        chmod -R 777 /data/redis &&
        chmod -R 777 /data/evolution/instances &&
        chmod -R 777 /data/evolution/store &&
        echo 'Init complete'
      "
    volumes:
      - ./data:/data
    restart: "no"

  # ============================================================================
  # POSTGRESQL (Supabase)
  # ============================================================================
  postgres:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - postgres.internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      internal:
        aliases:
          - redis.internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # POSTGRES-INIT - Cria databases adicionais (evolution)
  # ============================================================================
  postgres-init:
    build:
      context: .
      dockerfile: docker/postgres-init/Dockerfile
    image: postgres-init:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    restart: "no"

  # ============================================================================
  # EVOLUTION - WhatsApp API (Evolution v2)
  # ============================================================================
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.internal:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis.internal:6379
      RABBITMQ_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      AUTHENTICATION_INSTANCE_MODE: container
    volumes:
      - ./data/evolution/instances:/evolution/instances
      - ./data/evolution/store:/evolution/store
    networks:
      internal:
        aliases:
          - evolution.internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  evolution-init:
    image: curlimages/curl:8.12.1
    depends_on:
      evolution:
        condition: service_healthy
    environment:
      EVOLUTION_URL: http://evolution.internal:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      WEBHOOK_URL: ${BACKBONE_WEBHOOK_URL}
    volumes:
      - ./docker/evolution/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    networks:
      - internal
    restart: "no"

  # ============================================================================
  # KONG - API Gateway (Supabase)
  # ============================================================================
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # JWT keys para validação
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./docker/kong/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      internal:
        aliases:
          - kong.internal
      shared-net:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supabase-api.rule=Host(`api.${PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.supabase-api.entrypoints=websecure"
      - "traefik.http.routers.supabase-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.supabase-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=shared-net"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # GOTRUE - Auth (Supabase)
  # ============================================================================
  gotrue:
    image: supabase/gotrue:v2.185.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@postgres.internal:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
    networks:
      internal:
        aliases:
          - gotrue.internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ============================================================================
  # POSTGREST - REST API (Supabase) — dependencia interna do Storage
  # ============================================================================
  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@postgres.internal:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_WEB_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_WEB_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: postgrest
    networks:
      internal:
        aliases:
          - postgrest.internal

  # ============================================================================
  # STORAGE - Storage API (Supabase)
  # ============================================================================
  storage:
    image: supabase/storage-api:v1.37.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres.internal:5432/postgres
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://postgrest.internal:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      STORAGE_BACKEND: file
      FILE_SIZE_LIMIT: 52428800
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy.internal:8080
    volumes:
      - ./data/storage:/var/lib/storage
    networks:
      internal:
        aliases:
          - storage.internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ============================================================================
  # IMGPROXY - Image Transformation (Supabase)
  # ============================================================================
  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
    volumes:
      - ./data/storage:/var/lib/storage:ro
    networks:
      internal:
        aliases:
          - imgproxy.internal
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ============================================================================
  # POSTGRES-META - Database Metadata API (Supabase)
  # ============================================================================
  postgres-meta:
    image: supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres.internal
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      internal:
        aliases:
          - postgres-meta.internal

  # ============================================================================
  # STUDIO - Dashboard Admin (Supabase)
  # ============================================================================
  studio:
    image: supabase/studio:latest
    restart: unless-stopped
    depends_on:
      postgres-meta:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://postgres-meta.internal:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong.internal:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: "true"
      DEFAULT_ORGANIZATION_NAME: Coletivos
      DEFAULT_PROJECT_NAME: Coletivos
    networks:
      internal:
        aliases:
          - studio.internal

networks:
  internal:
    driver: bridge
  shared-net:
    external: true
