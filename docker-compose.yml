# ==============================================================================
# Full Stack (Platform + Web)
# ==============================================================================
# Uso:
#   npm run docker:up     - Subir toda a stack
#   npm run docker:logs   - Ver logs
#   npm run docker:down   - Derrubar a stack
# ==============================================================================

name: chegala-${ENVIRONMENT}

include:
  - docker-compose.platform.yml

services:

  # ============================================================================
  # CADDY - Reverse Proxy
  # ============================================================================
  # Unifica todas as rotas em uma única porta:
  # - /auth/*, /rest/*, /storage/*, /functions/*, /realtime/* -> Kong (Supabase)
  # - /* -> App (Vite)
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT}:${PUBLIC_PORT}"
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT}
      BACKBONE_HOST: ${BACKBONE_HOST}
      BACKBONE_PORT: ${BACKBONE_PORT}
      CENTRAL_HOST: ${CENTRAL_HOST}
      CENTRAL_PORT: ${CENTRAL_PORT}
      LOJISTA_HOST: ${LOJISTA_HOST}
      LOJISTA_PORT: ${LOJISTA_PORT}
      MOTOBOY_HOST: ${MOTOBOY_HOST}
      MOTOBOY_PORT: ${MOTOBOY_PORT}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      internal:
        aliases:
          - caddy.internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${PUBLIC_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # BACKBONE - Hono API
  # ============================================================================
  backbone:
    image: node:22-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKBONE_PORT}:${BACKBONE_PORT}"
    environment:
      PORT: ${BACKBONE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.internal:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - .:/app
    command: ["npm", "run", "-w", "apps/backbone", "dev"]
    networks:
      internal:
        aliases:
          - backbone.internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${BACKBONE_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  internal:
    driver: bridge
  shared-net:
    external: true
