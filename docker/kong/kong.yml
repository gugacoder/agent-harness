_format_version: "2.1"
_transform: true

###
### Kong declarative configuration for Supabase self-hosted
### Routes proxy to internal services, JWT validation is done by services
###

services:
  # ==========================================================================
  # AUTH - GoTrue (/auth/v1/*)
  # ==========================================================================
  - name: auth-v1
    url: http://gotrue.internal:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # ==========================================================================
  # REST - PostgREST (/rest/v1/*)
  # ==========================================================================
  - name: rest-v1
    url: http://postgrest.internal:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # ==========================================================================
  # STORAGE - Storage API (/storage/v1/*)
  # ==========================================================================
  - name: storage-v1
    url: http://storage.internal:5000
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  # ==========================================================================
  # REALTIME - WebSocket Subscriptions (/realtime/v1/*)
  # ==========================================================================
  - name: realtime-v1
    url: http://realtime.internal:4000
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  # ==========================================================================
  # FUNCTIONS - Edge Runtime (/functions/v1/*)
  # ==========================================================================
  - name: functions-v1
    url: http://edge-runtime.internal:9000
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
